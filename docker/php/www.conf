; M&E Platform — php-fpm pool overrides (loaded last, as zz-platform.conf).
[www]

; Container env must reach PHP: DB_HOST, REDIS_HOST and friends are injected by
; the orchestrator, not by a .env file inside the image.
clear_env = no

; Worker output goes to the container log, undecorated, so the log collector
; sees Laravel's stderr channel verbatim.
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Consumed by the container healthcheck via cgi-fcgi.
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status
