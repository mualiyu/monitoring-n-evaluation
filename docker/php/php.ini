; M&E Platform — PHP runtime overrides (loaded last, as zz-platform.ini).

memory_limit = 512M
max_execution_time = 120
expose_php = Off

; config/documents.php caps a single document at 20 MB (max_kb 20480). These
; sit above that so an oversized upload fails Laravel validation with a message
; instead of dying in the SAPI with an empty $_POST. Keep them in step with
; client_max_body_size in docker/nginx/app.conf.
upload_max_filesize = 24M
post_max_size = 32M
max_file_uploads = 30

; Store UTC; Africa/Lagos (or whatever the instance sets) is a display concern
; handled by config/app.php.
date.timezone = UTC

; The image is immutable — code never changes under a running container, so
; opcache never needs to stat it. Deploy = rebuild + rollout, not restart.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
