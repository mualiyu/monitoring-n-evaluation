# M&E Platform — nginx site.
#
# Security headers (CSP, HSTS, X-Frame-Options) are deliberately NOT set here:
# the app sets them per surface (see PortalSecurityHeaders), and duplicating
# them at the proxy produces two conflicting values for the same response.
# TLS/HSTS terminate at the edge (wildcard cert for *.<platform domain>).

server {
    listen 80 default_server;
    server_name _;

    # Host-based routing: every surface — apex, www., oversight., {tenant}. —
    # is the same document root. bootstrap/app.php rejects hosts off the
    # platform domain, so a wildcard server_name here is not a wildcard app.
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Matches post_max_size in docker/php/php.ini.
    client_max_body_size 32m;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # storage/app/public only — reached through the symlink baked into the
    # image. The documents disk lives outside the document root by design and
    # is served by a signed, permission-checked route.
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # Excel/PDF exports and large report renders outlast the 60s default.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Nothing but the front controller executes.
    location ~ \.php$ {
        return 404;
    }

    # No dotfiles, no .env, no .git — whatever ends up in the root.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
